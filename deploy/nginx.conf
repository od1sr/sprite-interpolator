# Docker's embedded DNS tracks container IPs across Compose recreations.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream sprite_backend {
    zone sprite_backend 64k;
    server backend:8000 resolve;
}

upstream sprite_frontend {
    zone sprite_frontend 64k;
    server frontend:5173 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://sprite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://sprite_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
